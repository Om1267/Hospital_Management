{% extends 'base.html' %}
{% block title %}Generate Bill{% endblock %}
{% block page_title %}Generate Bill{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 mb-0"><i class="bi bi-receipt-cutoff text-primary me-2"></i>Generate Bill</h1>
    <a href="{{ url_for('bills') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card"><div class="card-body">
    <form method="POST" novalidate id="billForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label fw-medium">Patient *</label>
                <select name="patient_id" class="form-select" required>
                    <option value="">— Select Patient —</option>
                    {% for p in patients %}
                    <option value="{{ p.id }}">{{ p.name }} (#{{ p.id }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-medium">Bill Type</label>
                <select name="bill_type" class="form-select">
                    <option value="Hospital">Hospital</option>
                    <option value="Pharmacy">Pharmacy</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">Doctor Fee (₹)</label>
                <input type="number" name="doctor_charge" class="form-control" min="0" value="1000">
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">Nurse Fee (₹)</label>
                <input type="number" name="nurse_charge" class="form-control" min="0" value="500">
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">Lab Charges (₹)</label>
                <input type="number" name="lab_charge" class="form-control" min="0" value="0">
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">Discount (₹)</label>
                <input type="number" name="discount" class="form-control" min="0" value="0">
            </div>

            <div class="col-12">
                <label class="form-label fw-medium">Medicines</label>
                <div id="medicineLines">
                    <div class="row g-2 mb-2 medicine-line">
                        <div class="col-md-7">
                            <select name="medicine_ids" class="form-select form-select-sm">
                                <option value="">— Select Medicine —</option>
                                {% for m in medicines %}
                                <option value="{{ m.id }}">{{ m.name }} (₹{{ m.price }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <input type="number" name="medicine_qtys" class="form-control form-control-sm" placeholder="Qty" min="1" value="1">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-sm btn-outline-danger remove-line">Remove</button>
                        </div>
                    </div>
                </div>
                <button type="button" id="addMedLine" class="btn btn-sm btn-outline-primary mt-1">
                    <i class="bi bi-plus-lg me-1"></i>Add Medicine Line
                </button>
            </div>

            <div class="col-12 mt-2">
                <button type="submit" class="btn btn-success px-4"><i class="bi bi-check-lg me-1"></i>Generate Bill</button>
                <a href="{{ url_for('bills') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </div>
    </form>
</div></div>
{% endblock %}
{% block scripts %}
<script>
// Dynamic medicine lines
const template = document.querySelector('.medicine-line').outerHTML;
const container = document.getElementById('medicineLines');

document.getElementById('addMedLine').addEventListener('click', () => {
    const div = document.createElement('div');
    div.innerHTML = template;
    container.appendChild(div.firstChild);
});

container.addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-line')) {
        const lines = document.querySelectorAll('.medicine-line');
        if (lines.length > 1) {
            e.target.closest('.medicine-line').remove();
        } else {
            // Reset the single line
            const line = lines[0];
            line.querySelector('select').value = '';
            line.querySelector('input').value = '1';
        }
    }
});

// Auto-fill medicines from active prescriptions
document.querySelector('select[name="patient_id"]').addEventListener('change', function() {
    const patientId = this.value;
    if (!patientId) return;

    fetch('/api/patients/' + patientId + '/prescriptions')
        .then(response => response.json())
        .then(data => {
            if (data && data.length > 0) {
                // Clear the container
                container.innerHTML = '';
                
                // Add a line for each prescription
                data.forEach(p => {
                    const div = document.createElement('div');
                    div.innerHTML = template;
                    const line = div.firstChild;
                    
                    // Set select option and quantity
                    const select = line.querySelector('select');
                    select.value = p.medicine_id;
                    
                    const qtyInp = line.querySelector('input');
                    qtyInp.value = p.quantity;
                    
                    container.appendChild(line);
                });
            }
        })
        .catch(err => console.error('Error fetching prescriptions:', err));
});
</script>
{% endblock %}
