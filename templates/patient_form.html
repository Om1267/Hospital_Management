{% extends 'base.html' %}
{% block title %}{{ action }} Patient{% endblock %}
{% block page_title %}{{ action }} Patient{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 mb-0"><i class="bi bi-person-fill-add text-primary me-2"></i>{{ action }} Patient</h1>
    <a href="{{ url_for('patients') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-medium">Full Name *</label>
                    <input type="text" name="name" class="form-control" required minlength="2" maxlength="100"
                           value="{{ patient.name if patient else '' }}" placeholder="Patient full name">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-medium">Age *</label>
                    <input type="number" name="age" class="form-control" required min="0" max="150"
                           value="{{ patient.age if patient else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-medium">Gender *</label>
                    <select name="gender" class="form-select" required>
                        <option value="">Select…</option>
                        {% for g in ['Male','Female','Other'] %}
                        <option value="{{ g }}" {{ 'selected' if patient and patient.gender == g }}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-medium">Blood Group</label>
                    <select name="blood_group" class="form-select">
                        <option value="">Unknown</option>
                        {% for bg in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}
                        <option value="{{ bg }}" {{ 'selected' if patient and patient.blood_group == bg }}>{{ bg }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-medium">Mobile *</label>
                    <input type="text" name="mobile" class="form-control" required pattern="^\+?[\d\s-]{10,15}$"
                           value="{{ patient.mobile if patient else '' }}" placeholder="10-digit mobile">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-medium">Email</label>
                    <input type="email" name="email" class="form-control"
                           value="{{ patient.email if patient else '' }}" placeholder="patient@example.com">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-medium">Emergency Contact</label>
                    <input type="text" name="emergency_contact" class="form-control" pattern="^\+?[\d\s-]{10,15}$"
                           value="{{ patient.emergency_contact if patient else '' }}">
                </div>

                <div class="col-12">
                    <label class="form-label fw-medium">Address</label>
                    <textarea name="address" class="form-control" rows="2"
                              placeholder="Full address">{{ patient.address if patient else '' }}</textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-medium">Disease / Diagnosis</label>
                    <input type="text" name="disease" class="form-control" maxlength="200"
                           value="{{ patient.disease if patient else '' }}" placeholder="e.g. Typhoid, Fracture…">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium">Assign Doctor</label>
                    <select name="doctor_id" class="form-select">
                        <option value="">— None —</option>
                        {% for d in doctors %}
                        <option value="{{ d.id }}" {{ 'selected' if patient and patient.doctor_id == d.id }}>
                            {{ d.name }} ({{ d.department }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-medium">Ward</label>
                    <select name="ward_id" class="form-select">
                        <option value="">— None —</option>
                        {% for w in wards %}
                        <option value="{{ w.id }}" {{ 'selected' if patient and patient.ward_id == w.id }}>
                            {{ w.ward_number }} – {{ w.ward_type }} ({{ w.available_beds }} beds available)
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium">Room</label>
                    <select name="room_id" class="form-select">
                        <option value="">— None —</option>
                        {% for r in rooms %}
                        <option value="{{ r.id }}" {{ 'selected' if patient and patient.room_id == r.id }}>
                            {{ r.room_number }} – {{ r.room_type }} (Floor {{ r.floor }}) – ₹{{ r.daily_rate }}/day
                            {% if r.status != 'Available' %}[{{ r.status }}]{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                {% if action == 'Edit' %}
                <div class="col-md-4">
                    <label class="form-label fw-medium">Status</label>
                    <select name="status" class="form-select">
                        {% for s in ['Admitted', 'Under Treatment', 'Discharged'] %}
                        <option value="{{ s }}" {{ 'selected' if patient and patient.status == s }}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}

                <div class="col-12 mt-2">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check-lg me-1"></i>{{ action }} Patient
                    </button>
                    <a href="{{ url_for('patients') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
