{% extends 'base.html' %}
{% block title %}{{ action }} Appointment{% endblock %}
{% block page_title %}{{ action }} Appointment{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 mb-0"><i class="bi bi-calendar-plus text-primary me-2"></i>{{ action }} Appointment</h1>
    <a href="{{ url_for('appointments') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card"><div class="card-body">
    <form method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-medium">Patient *</label>
                <select name="patient_id" class="form-select" required>
                    <option value="">— Select Patient —</option>
                    {% for p in patients %}
                    <option value="{{ p.id }}" {{ 'selected' if appt and appt.patient_id == p.id }}>{{ p.name }} ({{ p.disease or 'General' }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-medium">Doctor *</label>
                <select name="doctor_id" class="form-select" required>
                    <option value="">— Select Doctor —</option>
                    {% for d in doctors %}
                    <option value="{{ d.id }}" {{ 'selected' if appt and appt.doctor_id == d.id }}>{{ d.name }} – {{ d.department }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-medium">Date *</label>
                <input type="date" name="date" class="form-control" required value="{{ appt.date.isoformat() if appt else '' }}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-medium">Time *</label>
                <input type="time" name="time" class="form-control" required value="{{ appt.time if appt else '' }}">
            </div>
            {% if action == 'Edit' %}
            <div class="col-md-3">
                <label class="form-label fw-medium">Status</label>
                <select name="status" class="form-select">
                    {% for s in ['Scheduled','Completed','Cancelled'] %}
                    <option value="{{ s }}" {{ 'selected' if appt and appt.status == s }}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="col-12">
                <label class="form-label fw-medium">Notes</label>
                <textarea name="notes" class="form-control" rows="2" placeholder="Optional notes…">{{ appt.notes if appt else '' }}</textarea>
            </div>
            <div class="col-12 mt-2">
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>{{ action }}</button>
                <a href="{{ url_for('appointments') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </div>
    </form>
</div></div>
{% endblock %}
