{% extends 'base.html' %}
{% block title %}{{ action }} Room{% endblock %}
{% block page_title %}{{ action }} Room{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 mb-0"><i class="bi bi-door-open-fill text-primary me-2"></i>{{ action }} Room</h1>
    <a href="{{ url_for('rooms') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card"><div class="card-body">
    <form method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label fw-medium">Room Number *</label>
                <input type="text" name="room_number" class="form-control" required maxlength="20" value="{{ room.room_number if room else '' }}" placeholder="e.g. 101">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-medium">Room Type *</label>
                <select name="room_type" class="form-select" required>
                    {% for t in ['General','Semi-Private','Private','ICU'] %}
                    <option value="{{ t }}" {{ 'selected' if room and room.room_type == t }}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">Floor *</label>
                <input type="number" name="floor" class="form-control" min="1" required value="{{ room.floor if room else 1 }}">
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">Daily Rate (₹)</label>
                <input type="number" name="daily_rate" class="form-control" min="0" value="{{ room.daily_rate if room else 500 }}">
            </div>
            {% if action == 'Edit' %}
            <div class="col-md-2">
                <label class="form-label fw-medium">Status</label>
                <select name="status" class="form-select">
                    {% for s in ['Available','Occupied','Maintenance'] %}
                    <option value="{{ s }}" {{ 'selected' if room and room.status == s }}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="col-12 mt-2">
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>{{ action }}</button>
                <a href="{{ url_for('rooms') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </div>
    </form>
</div></div>
{% endblock %}
